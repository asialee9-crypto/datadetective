services:
  - type: web
    name: datadetective-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        sync: false
      - key: NEBIUS_MODEL
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: datadetective
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
